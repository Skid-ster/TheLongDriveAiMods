# Manual convenience entry; normal pushes build exactly once via build.yml.
name: Build Singularity manually
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build src/Singularity/Singularity.csproj --configuration Release --warnaserror
      - uses: actions/upload-artifact@v4
        with:
          name: Singularity
          path: src/Singularity/bin/Release/net48/Singularity.dll
          if-no-files-found: error
