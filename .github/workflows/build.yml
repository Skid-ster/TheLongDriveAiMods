name: Build Car06Diesel
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Verify game references
        shell: pwsh
        run: |
          $names = 'Assembly-CSharp', 'UnityEngine', 'UnityEngine.CoreModule', 'UnityEngine.AudioModule', 'UnityEngine.PhysicsModule', 'TLDLoader', '0Harmony'
          foreach ($name in $names) {
            if (!(Test-Path "libs/$name.dll")) { throw "Missing libs/$name.dll" }
          }
      - name: Compile (warnings are errors)
        run: dotnet build src/Car06Diesel/Car06Diesel.csproj --configuration Release --warnaserror
      - uses: actions/upload-artifact@v6
        with:
          name: Car06Diesel
          path: src/Car06Diesel/bin/Release/net48/Car06Diesel.dll
          if-no-files-found: error
