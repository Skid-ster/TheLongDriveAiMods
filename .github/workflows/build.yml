name: Build Car 04 Race Restomod

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Build mod
        run: dotnet build src/Car04RaceRestomod/Car04RaceRestomod.csproj --configuration Release

      - name: Place DLL in mods folder
        shell: pwsh
        run: |
          $destination = "mods/Car 04 Race Restomod"
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          Copy-Item "src/Car04RaceRestomod/bin/Release/net48/M_Car04RaceRestomod.dll" "$destination/M_Car04RaceRestomod.dll" -Force

      - name: Commit built DLL to this branch
        if: github.event_name == 'push'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "mods/Car 04 Race Restomod/M_Car04RaceRestomod.dll"
          if ! git diff --cached --quiet; then
            git commit -m "Update Car 04 Race Restomod DLL [skip ci]"
            git push
          fi

      - name: Upload compiled mod
        uses: actions/upload-artifact@v7
        with:
          name: Car04RaceRestomod
          path: mods/
          if-no-files-found: error
