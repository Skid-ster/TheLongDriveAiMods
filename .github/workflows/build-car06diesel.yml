# Manual convenience entry; normal pushes build exactly once via build.yml.
name: Build Car06Diesel manually
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build src/Car06Diesel/Car06Diesel.csproj --configuration Release --warnaserror
      - uses: actions/upload-artifact@v6
        with:
          name: Car06Diesel
          path: src/Car06Diesel/bin/Release/net48/Car06Diesel.dll
          if-no-files-found: error
